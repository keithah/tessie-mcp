services:
  tessie-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: 8081
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/.well-known/mcp-config >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
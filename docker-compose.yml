services:
  tessie-mcp:
    build: .
    environment:
      TESSIE_API_KEY: ${TESSIE_API_KEY:?TESSIE_API_KEY is required}
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?MCP_AUTH_TOKEN is required}
      DEFAULT_VIN: ${DEFAULT_VIN:-}
      DATA_DIR: ${DATA_DIR:-/data}
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    volumes:
      - tessie-mcp-data:${DATA_DIR:-/data}
    restart: unless-stopped
volumes:
  tessie-mcp-data:
